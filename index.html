<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Desetiboj</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="screen" width="256" height="192"></canvas>

    <div id="touch" aria-label="Dotykové ovládání">
        <button data-act="left" aria-label="Vlevo">◀</button>
        <button data-act="right" aria-label="Vpravo">▶</button>
        <button data-act="pause" aria-label="Pauza" class="small">❚❚</button>
        <button data-act="action" class="jump" aria-label="Akce">AKCE</button>
    </div>

    <script src="js/gfx.js"></script>
    <script src="js/font.js"></script>
    <script src="js/events.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
